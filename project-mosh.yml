name: HerdDeck
options:
  bundleIdPrefix: com.herddeck
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: f02e34bb7d564408a0f48d5c73d382ddb7d04dc0
  HerdDeckMoshBinaries:
    path: Vendor/MoshBinaryPackage

targets:
  HerdDeck:
    type: application
    platform: iOS
    sources:
      - path: iOS/HerdDeck
      - path: iOS/HerdDeckMosh
    dependencies:
      - package: SwiftTerm
      - package: HerdDeckMoshBinaries
        product: HerdDeckMoshBinaries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herddeck.app
        PRODUCT_NAME: HerdDeck
        INFOPLIST_KEY_CFBundleDisplayName: HerdDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERDDECK_EMBEDDED_MOSH"
        SWIFT_OBJC_BRIDGING_HEADER: iOS/HerdDeckMosh/HerdDeckMosh-Bridging-Header.h
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -lc++
          - -lz
          - -liconv
        CLANG_CXX_LANGUAGE_STANDARD: c++17
    info:
      path: iOS/HerdDeck/Resources/Info.plist
      properties:
        CFBundleDisplayName: HerdDeck
        UILaunchScreen: {}
        NSFaceIDUsageDescription: HerdDeck uses device authentication before allowing remote terminal input.
        NSLocalNetworkUsageDescription: HerdDeck connects to your Mac through your private Tailscale network for Herdr and Mosh terminal sessions.
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.herddeck.pairing
            CFBundleURLSchemes:
              - herddeck
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - HerdDeckTests
      gatherCoverageData: true

  HerdDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOS/HerdDeckTests
    dependencies:
      - target: HerdDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herddeck.tests
        GENERATE_INFOPLIST_FILE: YES
